spring.application.name=pixflow

spring.datasource.url=jdbc:postgresql://localhost:5432/meu_banco

spring.datasource.username=meu_usuario
spring.datasource.password=minha_senha_segura
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.beeleza.pixflow.adapter.in.kafka
spring.kafka.consumer.group-id=pixflow-settlement
spring.kafka.consumer.auto-offset-reset=earliest